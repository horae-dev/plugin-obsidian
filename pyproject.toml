[project]
name = "horae-plugin-obsidian"
version = "0.1.3"
description = "Horae plugin: read and write an Obsidian vault (Obsidian Tasks syntax)."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "horae-sdk>=0.9,<0.10",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/horae_obsidian"]

[dependency-groups]
dev = [
    "hypothesis>=6.140",
    "mypy>=2.4",
    "pre-commit>=4.7",
    "pytest>=9.1",
    "pytest-cov>=7",
    "ruff>=0.17",
    "types-pyyaml>=6",
]

[tool.uv]
required-version = ">=0.13"
# No exclude-newer here: `horae plugin add` runs `uv sync --locked --no-config`, which ignores
# this table, so a lock resolved with it would not match. The 7-day cooldown on new releases
# is Renovate's minimumReleaseAge (renovate.json).

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
# Byte-exact Markdown fixtures (CRLF, BOM, invalid UTF-8): never formatted.
extend-exclude = ["tests/fixtures"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "S", "PT"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
strict = true
files = ["src", "tests"]
python_version = "3.12"
warn_unreachable = true
enable_error_code = ["ignore-without-code", "redundant-expr", "truthy-bool"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-config --strict-markers"
xfail_strict = true
filterwarnings = ["error"]

[tool.coverage.run]
source = ["horae_obsidian"]
branch = true

[tool.coverage.report]
fail_under = 85
show_missing = true
exclude_also = ["if TYPE_CHECKING:", "if __name__ == .__main__.:"]
